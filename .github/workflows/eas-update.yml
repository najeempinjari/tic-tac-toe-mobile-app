name: EAS Update (OTA)

on:
  push:
    branches: [main]

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        run: npx eas-cli update --branch production --message "Auto OTA update from ${{ github.sha }}" --non-interactive
